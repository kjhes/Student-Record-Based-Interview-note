<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>생기부 면접노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#E3E8F1; --ink:#0F1729; --ink-2:#596379; --line:#D5DCE8;
  --navy:#16233F; --navy-ink:#F3F6FC; --navy-2:#A9B6D3;
  --hi:#FFD43B; --hi-ink:#16233F; --marker:rgba(255,212,59,.55); --memo-bg:#FFFBE8; --memo-line:#ECE2BC; --memo-margin:rgba(210,63,55,.38); --memo-rule:#E2D49A;
  --ok:#14965F; --ok-ink:#FFFFFF; --danger:#D23F37;
  --a-setuk:#3563E9; --a-jayul:#12976F; --a-dongari:#E2640F; --a-jinro:#7C4DEB; --a-haengteuk:#D4386A; --a-etc:#66738C; --a-common:#B7791F;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B101B; --surface:#151C2B; --surface-2:#1F2739; --ink:#EDF1F8; --ink-2:#9AA5BB; --line:#283149;
    --navy:#1B2A4C; --navy-ink:#F3F6FC; --navy-2:#9FB0D6; --marker:rgba(255,212,59,.26); --memo-bg:#1F1D15; --memo-line:#36321F; --memo-margin:rgba(240,106,96,.38); --memo-rule:#4A4429;
    --ok:#33BE85; --ok-ink:#06140E; --danger:#F06A60;
    --a-setuk:#7196FF; --a-jayul:#38C39B; --a-dongari:#FF9450; --a-jinro:#A687FF; --a-haengteuk:#FF6F9B; --a-etc:#97A2B8; --a-common:#E3A63D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B101B; --surface:#151C2B; --surface-2:#1F2739; --ink:#EDF1F8; --ink-2:#9AA5BB; --line:#283149;
  --navy:#1B2A4C; --navy-ink:#F3F6FC; --navy-2:#9FB0D6; --marker:rgba(255,212,59,.26); --memo-bg:#1F1D15; --memo-line:#36321F; --memo-margin:rgba(240,106,96,.38); --memo-rule:#4A4429;
  --ok:#33BE85; --ok-ink:#06140E; --danger:#F06A60;
  --a-setuk:#7196FF; --a-jayul:#38C39B; --a-dongari:#FF9450; --a-jinro:#A687FF; --a-haengteuk:#FF6F9B; --a-etc:#97A2B8; --a-common:#E3A63D;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding-inline:16px;padding-block:0 48px}
.app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a-setuk);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;min-height:56px;margin-inline:-16px;padding-inline:16px}
.brand{font:20px/1 var(--display);letter-spacing:-.01em}
.back{border:0;background:none;padding:8px 10px 8px 0;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.back::before{content:"";width:9px;height:9px;border:solid currentColor;border-width:0 0 2.5px 2.5px;transform:rotate(45deg)}
.back:hover{color:var(--ink)}
.sync{margin-left:auto;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync.ok i{background:var(--ok)} .sync.busy i{background:#E0A800} .sync.bad i{background:var(--danger)}

.screen{display:grid;gap:18px;padding-top:6px}
.title{font:30px/1.2 var(--display);margin:4px 0 0;letter-spacing:-.01em}
.lead{margin:-8px 0 0;color:var(--ink-2)}
.label{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 8px;display:block;letter-spacing:.02em}
.label em{font-style:normal;font-weight:400}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.msg{font-size:14px;font-weight:600;color:var(--ok);margin:0;min-height:1.4em}
.msg.bad{color:var(--danger)}
.banner{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border-radius:14px;padding:12px 16px;font-size:14px}


/* menu tiles */
.menu{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:20px 22px}
.tile b{font-size:20px;font-weight:700}
.tile small{grid-column:1;font-size:14px;color:var(--ink-2)}
.tile::after{content:"";grid-column:2;grid-row:1/3;width:11px;height:11px;border:solid currentColor;border-width:2.5px 2.5px 0 0;transform:rotate(45deg);opacity:.5}
.tile.main{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.tile.main small{color:var(--hi-ink);opacity:.75}
.tile:hover{border-color:var(--ink-2)}
.tile.main:hover{filter:brightness(.97)}

/* buttons */
.primary{width:100%;border:0;border-radius:16px;background:var(--hi);color:var(--hi-ink);font-size:17px;font-weight:700;padding:16px 20px;min-height:56px}
.primary:hover{filter:brightness(.97)}
.primary:disabled{opacity:.45;cursor:default;filter:none}
.primary.done{background:var(--ok);color:var(--ok-ink)}
.primary.sm{width:auto;min-height:0;padding:12px 18px;font-size:15px;border-radius:12px}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px}
.ghost[aria-pressed="true"]{border-color:var(--ink);}
.ghost:disabled{opacity:.6;cursor:default}
.link{border:0;background:none;padding:6px 4px;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.region{display:grid;gap:18px}
.tails .region{gap:12px}
.kbd-hint{font:500 12px var(--mono);color:var(--ink-2);text-align:center;margin:-8px 0 0}
.tails{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:18px}
.tail{display:grid;gap:6px;padding-left:14px;border-left:3px solid var(--line)}
.tail-head{display:flex;align-items:center;gap:6px}
.tn{font:500 12.5px var(--mono);color:var(--ink-2);flex:none}
.tail-q{flex:1;border-color:transparent;background:transparent;font-weight:600;padding:6px 8px}
.tail-q:hover{border-color:var(--line)}
.tail-a{min-height:96px}
.p-tail{font-size:clamp(18px,4.6vw,21px);font-weight:700;margin:0;line-height:1.5;word-break:keep-all}
.kfix{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);font-size:14px}
.kfix span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kfix button{flex:none;border:0;border-radius:10px;background:var(--hi);color:var(--hi-ink);font-weight:700;padding:8px 12px}
.kfix kbd{font:500 11px var(--mono);opacity:.7}
.quiet{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding-top:6px}

/* inputs */
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;font-size:16px}
.field:focus{outline:none;border-color:var(--ink)}
textarea.field{resize:vertical;line-height:1.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:2px;scrollbar-width:none}
.chip{--c:var(--ink-2);flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.all::before{display:none}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"]::before{background:#fff}
.chip.static{cursor:default;padding:5px 12px;font-size:13px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--ok)}

/* list rows */
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{--c:var(--ink-2);width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px 14px 20px;display:grid;gap:6px;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.row:hover{border-color:var(--ink-2)}
.row-top{font-size:13px;font-weight:600;color:var(--c)}
.row-text{font:16px/1.65 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.row-meta{font:500 12.5px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row-meta .full{color:var(--ok)}
.count{font:500 13px var(--mono);color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);padding:28px 0;display:grid;gap:16px;justify-items:center}

/* sentence screen */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.quote{margin:0;background:var(--surface);border-radius:20px;padding:22px 22px;font:19px/1.95 var(--serif);word-break:keep-all;overflow-wrap:anywhere;border:1px solid var(--line)}
.hl{background:linear-gradient(transparent 56%,var(--marker) 56%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{margin:6px 0 -6px;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.qrows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qrow{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start}
.qrow:hover{border-color:var(--ink-2)}
.qn{font:500 13px/1.8 var(--mono);color:var(--ink-2);grid-row:1/3}
.qt{font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.qs{font-size:12.5px;color:var(--ink-2)}
.qrow.done .qs{color:var(--ok);font-weight:600}
.addq{display:flex;gap:8px}
.edit{display:grid;gap:10px}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit-actions{display:flex;gap:10px;align-items:center}

/* question screen */
.ctx{margin:0;font:14px/1.6 var(--serif);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qno{margin:0 0 -10px;font:500 13px var(--mono);color:var(--ink-2)}
.qbig{margin:0;font-size:clamp(22px,5.6vw,27px);line-height:1.45;font-weight:700;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.01em}
.ans{min-height:220px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager .ghost:last-child{text-align:right}

/* practice */
.p-top{display:flex;align-items:center;justify-content:space-between;font:500 14px var(--mono);color:var(--ink-2)}
.timer{font:28px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.timer.over{color:var(--danger)}
.p-stage{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:grid;gap:16px;min-height:220px;align-content:start}
.reveal{border-top:1px dashed var(--line);padding-top:14px}
.reveal p{margin:0;white-space:pre-wrap}
.reveal .quote{padding:0;border:0;background:none;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.finish{text-align:center;padding:30px 0 6px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em}
.big{margin:4px 0 12px;font:72px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.big span{font-size:32px;margin-left:4px}
/* AI check */
.ai{display:grid;gap:12px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface-2)}
.ai-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-head b{font-size:15px;margin-right:auto}
.ai-btns{display:flex;gap:8px;flex-wrap:wrap}
.ai-btns .ghost{padding:9px 14px;font-size:14px}
.ai-out{white-space:pre-wrap;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;margin:0}
.ai-out.wait{color:var(--ink-2)}
.ai-saved{border-top:1px solid var(--line);padding-top:12px}
.ai-label{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.ai-res{font-weight:600}
.fx{display:grid;gap:10px}
.fx-verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px;color:#fff;flex:none}
.badge.good{background:var(--ok)} .badge.mid{background:#D98A00} .badge.bad{background:var(--danger)}
.fx-legend{font-size:13px;color:var(--ink-2);word-break:keep-all}
.fx-why{margin:-4px 0 0;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.fx-main{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fx-big{font-size:16px;font-weight:700;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;margin:0}
.fx-k{font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.fx-detail{gap:12px;margin-top:10px}
.fx-kv{display:grid;gap:2px}
.fx-v{font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.fx-p{margin:0;font-size:15px;line-height:1.65;word-break:keep-all}
.fx-ul{margin:-4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px;line-height:1.6;word-break:keep-all}
.ai-more{margin-top:8px}
.ai-more summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2);padding:4px 0}
.ai-more .ai-out{margin-top:6px}
.ai-err{color:var(--danger);font-size:14px;margin:0}
.ai-stale{margin:0 0 8px;font-size:13px;font-weight:600;color:#B26B00}
.ai-saved.stale .fx{opacity:.55}
.sug{border-top:1px solid var(--line);padding-top:10px}
.sug-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sug-item{display:grid;gap:4px;padding-left:12px;border-left:3px solid var(--hi)}
.badge.sug-p{font-size:11px;padding:1px 7px;vertical-align:2px;margin-right:2px;display:inline-block}
body[data-s="para"] .app{max-width:1200px}
.pwrap{display:grid;gap:18px}
.pmain{display:grid;gap:18px;min-width:0;align-content:start}
.pmemo{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;display:flex;flex-direction:column;max-height:40vh;background:var(--memo-bg);border:1px solid var(--memo-line);border-radius:4px 4px 16px 4px;box-shadow:0 10px 22px -14px rgba(0,0,0,.5);overflow:hidden}
.pmemo.min .pquote{max-height:3.9em}
.pmemo-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px 46px;border-bottom:2px solid var(--memo-rule);font-size:13px;color:var(--ink-2);flex:none}
.pmemo-head b{color:var(--ink);font-size:14px;white-space:nowrap}
.pmemo-head .meta-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pmemo-head .link{margin-left:auto;white-space:nowrap}
.pquote{margin:0;border:0;border-radius:0;box-shadow:none;flex:1 1 auto;min-height:0;overflow:auto;padding:2px 16px 14px 46px;font:15px/1.9em var(--serif);color:var(--danger);word-break:keep-all;overflow-wrap:anywhere;background-color:transparent;background-image:linear-gradient(to right,transparent 34px,var(--memo-margin) 34px,var(--memo-margin) 36px,transparent 36px),repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.9em - 1px),var(--memo-line) calc(1.9em - 1px),var(--memo-line) 1.9em);background-attachment:local}
.pquote .ps{color:var(--danger)}
.pquote sup{color:var(--danger);opacity:.7}
.pmemo-foot{margin:0;padding:6px 14px 8px 46px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--memo-line);flex:none}
@media (min-width:720px){
  .pwrap{grid-template-columns:minmax(260px,42%) minmax(0,1fr);align-items:start}
  .pmemo{top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 84px)}
  .pmemo .pq-min{display:none}
  .pmemo.min .pquote{max-height:none}
}
.ps.cur{outline:2px solid var(--navy);outline-offset:1px;border-radius:3px}
.ps sup{font:600 11px var(--mono);color:var(--ink-2);margin-right:3px}
.ps.has{font-weight:600}
mark.hm{background:#FFE14D;color:#8A120B;border-radius:2px;padding:0 1px;cursor:pointer}
.hl-hint{margin-top:-8px;font-size:13px}
.hlbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:#FFE14D;color:#111;border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hlbtn[hidden]{display:none}
.pblock{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.pb-head{margin:0;font-size:14px;color:var(--ink-2);word-break:keep-all;overflow-wrap:anywhere}
.pnum{display:inline-block;min-width:20px;font:600 12px var(--mono);margin-right:6px;color:var(--ink)}
.pq{display:flex;flex-direction:column;gap:8px}
.pq-q{margin:0;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.pq-n{font:500 13px var(--mono);color:var(--ink-2);margin-right:8px}
.pq-done{font-size:12px;font-weight:600;color:var(--ok-ink)}
.pblock.pmainq{border-top:0;padding:14px;border:2px solid var(--ok);border-radius:16px}
.pq-role{font-size:11px;padding:1px 8px;vertical-align:2px}
.pq-role.tail{display:inline-block;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);font-weight:600}
.subs{display:grid;gap:8px;margin-top:6px;padding-left:14px;border-left:2px dashed var(--line)}
.sub{display:grid;gap:6px}
.sub-add .field{font-size:14px}
.addq .primary.sm{white-space:nowrap;flex:none}
.ptails{display:grid;gap:10px;padding-left:14px;border-left:3px solid var(--line)}
.ptail{display:grid;gap:6px}
.ptail-q{margin:0;font-weight:600;font-size:14px;word-break:keep-all;overflow-wrap:anywhere}
.ptail .tail-a{min-height:72px}
.rew{border:2px solid var(--ok);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.rew-n{font-weight:500;color:var(--ink-2);font-size:12px;margin-left:6px}
.rew-t{font-size:15px;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
.rew .link{justify-self:end}
.pa-ai{display:flex;flex-direction:column;gap:8px}
.sug-q{margin:0;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.sug-why{margin:0;font-size:13px;color:var(--ink-2);word-break:keep-all}
.sug-add{justify-self:start;padding:7px 12px!important;font-size:13px!important}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .22s ease-out}

<script>
const AREAS=[["common","공통"],["jayul","자율·자치"],["dongari","동아리"],["jinro","진로"],["setuk","세특"],["haengteuk","행특"],["etc","기타"]];
const GL=g=>+g>0?g+"학년":"공통";
const AREA_LABEL=Object.fromEntries(AREAS);
const areaIdx=a=>{const i=AREAS.findIndex(x=>x[0]===a);return i<0?99:i};
const cvar=a=>`--c:var(--a-${AREA_LABEL[a]?a:"etc"})`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const TITLES={home:"홈",add:"문장 추가",browse:"내 생기부",sentence:"문장",question:"질문",psetup:"연습 설정",practice:"연습",plist:"답변 쓰기",para:"문단 답변"};

let db=null,loaded=false,connecting=true,items=new Map(),banner="";
const latestQs=new Map(),queues=new Map(),ansTimers=new Map();
let sync={text:"연결 중…",cls:"busy"};
let nav=[{s:"home"}],pending=false,confirmTimer=null;
const A={grade:+(store.get("lastGrade")||1),area:store.get("lastArea")||"setuk",subject:"",text:"",split:true,msg:"",bad:false,saving:false};
const B={grade:"all",area:"all",q:""};
const S={editing:false,confirm:null,drafts:{},tdrafts:{}};
const P={tail:0,grade:"all",area:"all",undone:false,order:[],idx:0,showSent:false,showAns:false,start:Date.now()};

/* ---------- AI 검사 (면접 준비 세션에서 정한 기준) ---------- */
const RULES=`(공개 저장소용: 개인 정보와 외부 자료가 담긴 기준은 뺐습니다.)`;
const BANK_TXT="(공개 저장소용: 개인 정보와 외부 자료가 담긴 기준은 뺐습니다.)";
let smp=null,smpOff=false,AI={busy:false,key:null,text:"",err:"",ctl:null};
const AREA_KO=a=>AREA_LABEL[a]||"기타";
function aiCtx(it,qs){
  if(it.area==="common")return `[공통 질문 묶음: 생기부 문장이 아니라 모든 지원자에게 나오는 질문이다. 아래는 이 묶음의 주제와 준비 기준]\n"${it.sentence}"\n\n[이 묶음에 학생이 써 둔 질문]\n${qs.length?qs.map((q,i)=>`Q${i+1}. ${q.q}`).join("\n"):"(없음)"}`;
  return `[생기부 문장]\n${GL(it.grade)} · ${AREA_KO(it.area)}${it.subject?" · "+it.subject:""}\n"${it.sentence}"\n\n[이 문장에 학생이 써 둔 질문]\n${qs.length?qs.map((q,i)=>`Q${i+1}. ${q.q}`).join("\n"):"(없음)"}`;
}
function aiPrompt(kind,it,qs,q){
  if(kind==="s")return `${RULES}\n\n${BANK_TXT}\n\n${aiCtx(it,qs)}\n\n[할 일] 이 문장에 대한 질문 세트를 심사위원 입장에서 검사해. 짧게.\n\n출력 형식: 먼저 [결과]만 3줄 이내로 쓰고, 다음 줄에 정확히 ===해설=== 한 줄을 쓴 뒤, 그 아래에 나머지를 순서대로 써.\n[결과] "판정: 충분/질문 부족/다시 짜기" 중 하나 + 한 줄 이유 (충분=가장 위험한 단어를 짚는 질문이 있음, 질문 부족=그 질문이 빠짐, 다시 짜기=대부분 문장과 상관없거나 겹침) 한 줄 + "넣을 질문: ○○" 또는 "고칠 질문: Q번호 → 이유 한 마디" 한 줄 (둘 다 필요 없으면 "그대로 좋음")\n[해설]\n문장 종류: 활동 문장/평가 문장 + 필요한 질문 수\n가장 위험한 단어: 하나, 왜 위험한지 한 줄\n판정 이유: 그 위험한 단어를 학생 질문이 짚었는지\n고칠 질문: 두 개를 한 번에 묻거나 문장과 상관없는 질문만 번호로 (없으면 \"없음\")\n빠진 질문: 위험한 단어를 짚는 질문이 없을 때만 1개. 기출을 본떴으면 본뜬 기출을 짧게, 아니면 (지어낸 질문)\n학과 연결 질문이 섞여 있으면: 번호와 한 줄 (학과와 먼 문장이면 \"실전 질문 (바로 나올 수 있음)\", 가까운 문장이면 \"추가 질문으로 따로\"; 없으면 이 줄 생략)\n\n마지막에 정확히 ===추천=== 한 줄을 쓰고, 그 아래에 이 문장에 더 넣을 만한 질문 1~3개를 JSON 배열로만 써. 기출 질문 은행에서 닮은 모양을 본떠 이 문장에 맞게 쓰고, 학생 질문과 겹치지 않게, 가장 위험한 단어를 짚는 것부터. 판정이 충분이어도 다음으로 위험한 단어를 짚는 질문 1개는 준다. 학과 연결 질문은 학과와 먼 문장일 때 1개까지 넣는다(바로 나올 수 있는 질문). 학생 질문에 압박 질문이 없고 이 문장에 학생의 판단·선택·주장·방법이 있으면 압박 질문 1개를 마지막에 넣고 \"p\":true로 표시한다(평가 문장이면 넣지 않는다).\n형식: [{\"q\":\"추천 질문\",\"why\":\"무엇을 확인하려는 질문인지 한 마디\",\"src\":\"본뜬 기출 몇 마디와 [연도 학과 · 전형] 또는 공식 기출, 없으면 지어낸 질문\",\"p\":false}]`;
  if(kind==="q")return `${RULES}\n\n${BANK_TXT}\n\n${aiCtx(it,qs)}\n\n[검사할 질문]\n${q.q}\n\n[할 일] 이 질문이 실제 면접에서 이 문장을 보고 나올 만한 질문인지 심사위원 입장에서 검사해. 짧게.\n\n출력 형식: 먼저 [결과]만 3줄 이내로 쓰고, 다음 줄에 정확히 ===해설=== 한 줄을 쓴 뒤, 그 아래에 나머지를 순서대로 써.\n[결과] "판정: 실전형/보완 필요/빗나감" 중 하나 + 한 줄 이유 (실전형=이 문장을 보고 실제로 나올 질문이고 위험한 단어를 짚음, 보완 필요=나올 수는 있지만 핵심을 비껴가거나 두 가지를 한 번에 물음, 빗나감=문장 내용과 상관없음. 학과와 먼 문장에서 묻는 학과 연결 질문은 빗나감이 아니라 실전형으로 본다) 한 줄 + "다듬은 질문: ○○" 한 줄 (그대로 좋으면 "다듬은 질문: 그대로")\n[해설]\n가장 위험한 단어: 이 문장에서 하나\n판정 이유: 한 줄 (질문이 짧은 것은 장점이다)\n렌즈: 검증/개념/이유/연결/압박 중 무엇인지 (압박이면 반례·한계/정당성/선택 이유/일관성 중 어느 유형인지)\n기출 근거: 위 기출 목록에서 닮은 모양 하나 (없으면 "기출에 닮은 모양 없음")\n고칠 점: 표현, 길이, 두 개를 한 번에 묻는지, 오타\n다듬은 질문: 한 줄 (그대로 좋으면 "그대로")\n이어질 꼬리질문 1~2개`;
  const n=(q.a||"").replace(/\s/g,"").length,sec=Math.round(n/5);
  const tails=(q.tails||[]).filter(t=>t.q&&t.q.trim());
  return `${RULES}\n\n${BANK_TXT}\n\n${aCtx(it,qs,q)}\n\n[질문]\n${q.q}\n\n[학생 답변] (공백 뺀 ${n}자, 말하면 약 ${sec}초로 추정)\n${q.a}\n${tails.length?"\n[꼬리질문과 답]\n"+tails.map((t,k)=>`꼬리${k+1}. ${t.q}\n답: ${t.a||"(없음)"}`).join("\n"):""}\n\n[할 일] 이 답변을 면접 답변 기준과 아래 [추가 기준 3개]로 채점해.\n\n[추가 기준 3개]\n- 구조: 질문 종류에 맞는 틀(판단=입장→이유→사례→정리 / 경험=상황·과제→행동→결과→배운 점 / 개념=개념→원리→사례)을 순서대로 따랐는지, 문장끼리 자연스럽게 이어지는지, 한 답에 이야기 줄기가 하나인지. 순서가 뒤섞였거나 같은 말을 되풀이하면 어디인지 짚는다.\n- 학과 적합: 금융·빅데이터학부(통계, 데이터를 모으고 해석함, 금융 판단 기준)에 닿는 관점이나 배운 점이 답에 담겼는지. 학과 이름을 매번 넣으라는 뜻이 아니다. 억지로 이어 붙였으면 그 구절을 짚는다. 학과와 먼 활동이면 실제로 한 일(자료를 찾고 비교·정리함 등) 중 데이터와 닿는 것 하나로 자연스럽게 닿는지 본다. 질문이 학과를 묻지 않았는데 안 닿은 것은 큰 문제로 보지 않는다. 학과 방향이나 확정된 3년 흐름과 어긋나는 말은 반드시 짚는다.\n- 맥락: 질문이 실제로 묻는 것(의도)에 답했는지, 문단 전체의 맥락(그 활동을 왜 했고 무엇을 했고 무엇을 남겼는지)을 바르게 읽었는지, 문단의 다른 활동 내용을 잘못 섞지 않았는지, 확정된 3년 흐름과 맞는지. \n- 질문과 다른 이야기를 했거나 문단 맥락을 잘못 읽었으면 판정은 다시 쓰기다.\n- O·△·X, 상·중·하, 점수 같은 등급 기호를 어디에도 쓰지 않는다. 말로만 쓴다.\n\n출력 형식: 먼저 [결과]만 4줄 이내로 쓰고, 다음 줄에 정확히 ===해설=== 한 줄을 쓴 뒤, 그 아래에 나머지를 순서대로 써.\n[결과] "판정: 바로 연습/한 곳 수정/다시 쓰기" 중 하나 + 한 줄 이유 (바로 연습=흐름과 핵심이 다 있어 소리 내어 연습하면 됨, 한 곳 수정=한 곳만 고치면 됨, 다시 쓰기=첫 문장이 질문에 안 맞거나 흐름이 끊기거나 조심할 말이 있음) 한 줄 + "가장 먼저 고칠 것: ○○" 한 줄\n[해설]\n위 기준들은 속으로만 따져 보고, 기준 이름별로 나눠 쓰지 않는다. 아래만 쓴다.\n문제점: 가장 중요한 것부터 최대 3개. 한 줄에 하나씩 \"- \"로 시작해, 답의 해당 구절을 짧게 따옴표로 인용하고, 왜 문제인지와 어떻게 바꾸면 되는지를 쉬운 말 한 문장으로 쓴다. 고칠 게 없으면 \"- 없음\".\n이어질 질문: 이 답을 들은 면접관이 이어서 물을 질문 1~2개 (지어낸 질문이면 표시)\n맞춤법: 고칠 것만 짧게 나열 (없으면 이 줄 생략)\n\n마지막에 정확히 ===고쳐 쓴 답=== 한 줄을 쓰고, 그 아래에 문제가 있던 문장만 고친 문장으로 쓴다. 답 전체를 다시 쓰지 않는다.\n형식: 고친 문장만 한 줄에 하나씩, 답에 나오는 순서대로, 최대 5줄. 원래 문장, 따옴표, 화살표(→), 번호, 설명은 쓰지 않는다. 문제가 없던 문장은 쓰지 않는다. 맞춤법만 틀린 문장도 고친 문장으로 쓴다.\n고치는 규칙:\n- 학생의 단어와 말투를 살리고 문제 있는 부분만 바꾼다. 학생이 자기 답에서 그 문장을 바로 찾아 바꿔 끼울 수 있어야 한다.\n- 생기부 문단과 학생 답(같은 문단의 다른 답 포함)에 없는 사실은 새로 넣지 않는다. 기억이 필요한 빈칸은 (○○)로 남긴다.\n- 빠진 내용을 넣어야 하면 넣을 문장을 그대로 쓴다.\n- 고칠 게 없으면 \"고칠 문장 없음\" 한 줄만 쓴다.`;
}
function aiErrCopy(c){
  return ({not_granted:"Claude 사용을 허락하지 않아서 검사를 쓸 수 없어요.",sampling_disabled:"이 계정에서는 Claude 검사를 쓸 수 없어요.",rate_limited:"요청이 많아요. 잠시 뒤에 다시 눌러 주세요.",session_expired:"다시 로그인해 주세요.",refused:"이 내용은 검사하지 못했어요. 문장을 바꿔 다시 시도해 주세요.",empty_completion:"답이 비어 있어요. 다시 눌러 주세요.",prompt_too_large:"내용이 너무 길어요. 답변을 줄여 주세요.",cancelled:""})[c]??"검사가 중간에 끊겼어요. 다시 눌러 주세요.";
}
function fmtAt(t){const d=new Date(t||0);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
const AI_SEP="===해설===";
const REC_SEP="===추천===";
function recsOf(t){
  const i=(t||"").indexOf(REC_SEP);if(i<0)return [];
  const r=t.slice(i+REC_SEP.length),a=r.indexOf("["),b=r.lastIndexOf("]");
  if(a<0||b<a)return [];
  try{const arr=JSON.parse(r.slice(a,b+1));return (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&x.q.trim()).slice(0,4).map(x=>({q:x.q.trim(),why:String(x.why||""),src:String(x.src||""),p:x.p===true}))}catch(e){return []}
}
const REW_SEP="===고쳐 쓴 답===";
function rewOf(t){t=t||"";const i=t.indexOf(REW_SEP);if(i<0)return "";let r=t.slice(i+REW_SEP.length);const k=r.indexOf(REC_SEP);if(k>=0)r=r.slice(0,k);return r.replace(/\*\*/g,"").trim()}
function aiSplit(t){t=t||"";const w=t.indexOf(REW_SEP);if(w>=0)t=t.slice(0,w);const k=t.indexOf(REC_SEP);if(k>=0)t=t.slice(0,k);const i=t.indexOf(AI_SEP);return i<0?[t.trim(),""]:[t.slice(0,i).replace(/\[결과\]\s*/,"").trim(),t.slice(i+AI_SEP.length).replace(/^\s*\[해설\]\s*/,"").trim()]}
const VERD={
  q:{"실전형":["good","이 문장 보고 실제로 나올 질문, 핵심 단어를 짚음"],"보완 필요":["mid","나올 순 있지만 핵심을 비껴가거나 두 개를 한 번에 물음"],"빗나감":["bad","문장과 상관없거나 이 문장 질문이 아님"]},
  s:{"충분":["good","핵심 단어를 짚는 질문이 들어 있음"],"질문 부족":["mid","핵심 단어를 짚는 질문이 빠짐"],"다시 짜기":["bad","대부분 문장과 상관없거나 겹침"]},
  a:{"바로 연습":["good","흐름과 핵심이 다 있음, 소리 내어 연습하면 됨"],"한 곳 수정":["mid","한 곳만 고치면 됨"],"다시 쓰기":["bad","첫 문장이 질문에 안 맞거나 흐름이 끊김, 조심할 말 있음"]}
};
function verdictTone(v){
  if(/고칠|^하/.test(v))return "bad";
  if(/보통|^중/.test(v))return "mid";
  if(/좋음|^상|그대로/.test(v))return "good";
  return "mid";
}
const clean=l=>l.replace(/\*\*/g,"").replace(/^#+\s*/,"").trim();
function fmtLines(text){
  const out=[];let ul=null;
  const flush=()=>{if(ul){out.push(`<ul class="fx-ul">${ul.join("")}</ul>`);ul=null}};
  for(let raw of String(text).split("\n")){
    const l=clean(raw);if(!l){flush();continue}
    const b=l.match(/^[-•·]\s*(.+)$/)||l.match(/^\d+[.)]\s+(.+)$/);
    if(b){(ul=ul||[]).push(`<li>${esc(b[1])}</li>`);continue}

function mergeMarks(m){m=(m||[]).filter(x=>x&&x.e>x.s).map(x=>({s:x.s,e:x.e})).sort((a,b)=>a.s-b.s);const o=[];for(const x of m){const l=o[o.length-1];if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e);else o.push(x)}return o}

function saveMarks(id,marks,pt,noUndo){const it=items.get(id);if(!it)return;if(!noUndo){HL_UNDO.push({id,prev:mergeMarks(it.marks)});if(HL_UNDO.length>50)HL_UNDO.shift()}it.marks=marks;if(pt)pt.innerHTML=markHTML(it.sentence,marks);writeItem(id,{marks})}

  if(code==="revoked"||code==="not_granted")return "저장 권한이 없습니다. 이 페이지의 소유자 계정으로 열어주세요.";
  return `저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요. (오류: ${code})`;
}

const flushAll=()=>[...ansTimers.keys()].forEach(flushAns);

/* ---------- navigation ---------- */
const cur=()=>nav[nav.length-1];
function resetScreenState(){S.editing=false;S.confirm=null;kHide();if(!AI.busy)AI={busy:false,key:null,text:"",err:"",ctl:null}}
// 데스크톱에서 문장/질문 화면에 들어오면 바로 쓸 수 있게 입력칸에 커서를 둔다 (휴대폰은 키보드가 튀어나와서 제외)
const finePointer=(()=>{try{return matchMedia("(pointer:fine)").matches}catch(e){return false}})();
function autoFocus(){
  if(!finePointer||S.editing)return;
  const s=cur().s;
  if(s==="sentence")focusLater("#s-addq");
  else if(s==="question")focusLater("#q-ans");
}
// 입력칸에 커서를 다시 넣는다: 바로 한 번, 화면이 바뀐 뒤 한 번, 저장이 끝난 뒤 한 번
function keepFocus(sel,p){
  const put=()=>{const el=$(sel);if(el&&document.activeElement!==el&&!textFocused()){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n)}catch(e){}}};
  put();focusLater(sel);if(p)p.then(()=>setTimeout(put,0));
}
function go(s,params={}){flushAll();resetScreenState();nav.push({s,...params});render(true);autoFocus()}
function replace(params){flushAll();resetScreenState();Object.assign(cur(),params);render(true);autoFocus()}
function back(){flushAll();resetScreenState();if(nav.length>1)nav.pop();render(true)}
function home(){flushAll();resetScreenState();nav=[{s:"home"}];render(true)}

/* ---------- render ---------- */
function textFocused(){
  const a=document.activeElement,box=$("#screen");
  return a&&box.contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"));
}
let composing=false;
document.addEventListener("compositionstart",()=>{composing=true});
document.addEventListener("compositionend",()=>{composing=false;
  if(navAfterCompose){const key=navAfterCompose;navAfterCompose=null;setTimeout(()=>navArrow({key,preventDefault(){}}),0)}if(pending)setTimeout(()=>{if(textFocused())patchRegions()},0)});
const VIEWS={home:vHome,add:vAdd,browse:vBrowse,sentence:vSentence,question:vQuestion,psetup:vSetup,practice:vPractice,plist:vPlist,para:vPara};
// 입력칸에 커서가 있을 때는 그 칸을 건드리지 않고, 목록 같은 표시 영역(data-region)만 바로 바꾼다.
function patchRegions(){
  const box=$("#screen"),c=cur(),fn=VIEWS[c.s];
  const ae=c.s==="para"?anchorEl():null,aTop=ae?ae.getBoundingClientRect().top:null;
  try{
  if(!fn||!box.querySelector("[data-region]"))return;
  const html=fn(c);if(html==null)return;
  const tmp=document.createElement("div");tmp.innerHTML=html;
  tmp.querySelectorAll("[data-region]").forEach(n=>{
    const live=box.querySelector(`[data-region="${n.dataset.region}"]`);
    if(live&&!live.contains(document.activeElement))live.innerHTML=n.innerHTML;
  });
  }finally{if(aTop!=null){const n=anchorEl();if(n){const d=n.getBoundingClientRect().top-aTop;if(Math.abs(d)>1)window.scrollBy(0,d)}}}
}
let ptrDown=false,ptrPending=false;
document.addEventListener("pointerdown",()=>{ptrDown=true},true);
const ptrEnd=()=>{if(!ptrDown)return;setTimeout(()=>{ptrDown=false;if(ptrPending){ptrPending=false;render()}},0)};
document.addEventListener("pointerup",ptrEnd,true);document.addEventListener("pointercancel",ptrEnd,true);
let anchorQid=null;
document.addEventListener("pointerdown",e=>{const t=e.target&&e.target.closest&&e.target.closest("[data-qid]");if(t&&cur().s==="para")anchorQid=t.dataset.qid},true);
document.addEventListener("focusin",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.qid&&cur().s==="para")anchorQid=t.dataset.qid});
function anchorEl(){return anchorQid?document.getElementById("pa-"+anchorQid):null}
function render(force){
  if(!force&&ptrDown){ptrPending=true;return}
  if(!force&&textFocused()){pending=true;if(!composing)patchRegions();return}
  pending=false;
  const c=cur(),prev=nav[nav.length-2];
  $("#bar").innerHTML=(prev?`<button type="button" class="back" data-act="back">${c.s==="practice"?"그만하기":TITLES[prev.s]}</button>`:`<span class="brand">생기부 면접노트</span>`)
    +`<span class="sync ${sync.cls}" id="sync"><i></i>${esc(sync.text)}</span>`;
  const fn=VIEWS[c.s]||vHome;
  const html=fn(c);if(html==null)return;
  document.body.dataset.s=c.s;
  const pqs=(document.getElementById("pquote")||{}).scrollTop||0;
  const ae=force!==true&&c.s==="para"?anchorEl():null,aTop=ae?ae.getBoundingClientRect().top:null;
  {const sc=$("#screen");if(force===true||c.s!=="para")sc.style.minHeight="";else sc.style.minHeight=Math.max(parseFloat(sc.style.minHeight)||0,sc.offsetHeight)+"px"}
  $("#screen").innerHTML=(banner?`<div class="banner">${esc(banner)}</div>`:"")+html;
  if(pqs&&force!==true){const n=document.getElementById("pquote");if(n)n.scrollTop=pqs}
  if(aTop!=null){const n=anchorEl();if(n){const d=n.getBoundingClientRect().top-aTop;if(Math.abs(d)>1)window.scrollBy(0,d)}}
  if(force===true){window.scrollTo(0,0);$("#screen").style.animation="none";void $("#screen").offsetWidth;$("#screen").style.animation=""}
}
function focusLater(sel){requestAnimationFrame(()=>{const el=$(sel);if(el){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n)}catch(e){}}})}
function seg(act,cur,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`}
function areaChips(act,cur,withAll,scroll){
  return `<div class="chips${scroll?" scroll":""}" role="group">${withAll?`<button type="button" class="chip all" data-act="${act}" data-v="all" aria-pressed="${cur==="all"}">전체</button>`:""}${AREAS.map(([k,l])=>`<button type="button" class="chip" style="${cvar(k)}" data-act="${act}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>`;
}
const GRADES=[["all","전체"],["1","1학년"],["2","2학년"],["3","3학년"]];

/* home */

  const st=stats();
  const practiceMain=st.q>0;
  return `<nav class="menu" aria-label="메뉴">
      <button type="button" class="tile${practiceMain?" main":""}" data-go="psetup"><b>면접 연습</b><small>${st.q?`내가 쓴 질문 ${st.q}개로 연습`:"질문을 쓰면 시작할 수 있어요"}</small></button>
      <button type="button" class="tile" data-go="common"><b>공통 질문</b><small>${(()=>{const c=all().filter(x=>x.area==="common");const n=c.reduce((a,x)=>a+qsOf(x.id).length,0);return c.length?`자기소개·지원동기·성적 질문 등 ${n}개`:"자기소개, 지원동기 같은 모든 지원자 질문"})()}</small></button>
      <button type="button" class="tile" data-go="plist"><b>답변 쓰기</b><small>${(()=>{const ps=paraList().filter(p=>p.ids.some(id=>qsOf(id).length));return ps.length?`문단 ${ps.length}개 · 문단 전체를 보며 답변`:"문단 전체를 보며 그 문단 질문에 답해요"})()}</small></button>
      <button type="button" class="tile" data-go="browse"><b>내 생기부</b><small>${st.n?`문장 ${st.n}개 · 질문 ${st.q}개 · 답변 ${st.a}개`:"문장을 보며 질문과 답변을 직접 써요"}</small></button>
      <button type="button" class="tile${practiceMain?"":" main"}" data-go="add"><b>문장 추가</b><small>생기부 내용을 붙여넣기</small></button>

}

/* browse */
function browseList(){
  const s=B.q.trim().toLowerCase();
  return all().filter(it=>{
    if(B.grade!=="all"&&String(it.grade)!==B.grade)return false;
    if(B.area!=="all"&&it.area!==B.area)return false;
    if(B.area==="all"&&it.area==="common")return false;
    if(!s)return true;
    return [it.sentence,it.subject,...qsOf(it.id).map(q=>q.q+" "+(q.a||"")+" "+(q.tails||[]).map(t=>t.q+" "+(t.a||"")).join(" "))].join(" ").toLowerCase().includes(s);
  });
}
function rowsHTML(){
  if(db&&!loaded)return `<p class="empty">불러오는 중…</p>`;
  if(!items.size)return `<div class="empty"><p>아직 저장된 문장이 없어요.</p><button type="button" class="primary sm" data-go="add">첫 문장 추가하기</button></div>`;
  const list=browseList();
  if(!list.length)return `<p class="empty">조건에 맞는 문장이 없어요.</p>`;
  return `<p class="count">${list.length}문장</p><ul class="rows">${list.map(it=>{
    const qs=qsOf(it.id),d=qs.filter(q=>q.done).length;
    return `<li><button type="button" class="row" style="${cvar(it.area)}" data-go="sentence" data-id="${it.id}">
      <span class="row-top">${GL(it.grade)} · ${AREA_LABEL[it.area]||"기타"}${it.subject?" · "+esc(it.subject):""}</span>
      <span class="row-text">${esc(it.sentence)}</span>
      <span class="row-meta">${qs.length?`질문 ${qs.length} · <span class="${d===qs.length?"full":""}">준비 ${d}/${qs.length}</span>`:"질문 없음"}</span>
    </button></li>`}).join("")}</ul>`;
}
function vBrowse(){
  return `<h1 class="title">${B.area==="common"?"공통 질문":"내 생기부"}</h1>
    ${seg("b-grade",B.grade,GRADES)}
    ${areaChips("b-area",B.area,true,true)}
    <input class="field" id="b-q" type="search" value="${esc(B.q)}" placeholder="문장·질문 검색" autocomplete="off">
    <div id="rows">${rowsHTML()}</div>`;
}

/* sentence */
function vSentence(c){
  const it=items.get(c.id);
  if(!it){if(loaded){nav.pop();render(true)}return null}
  const qs=qsOf(c.id);
  const opt=(v,l,cur)=>`<option value="${v}"${String(cur)===String(v)?" selected":""}>${l}</option>`;
  const body=S.editing?`<div class="edit">
      <div class="edit-row">
        <select class="field" id="e-grade" aria-label="학년">${[0,1,2,3].map(g=>opt(g,GL(g),it.grade)).join("")}</select>
        <select class="field" id="e-area" aria-label="영역">${AREAS.map(([k,l])=>opt(k,l,it.area)).join("")}</select>
      </div>
      <input class="field" id="e-subject" value="${esc(it.subject||"")}" placeholder="과목·활동명" aria-label="과목·활동명">
      <textarea class="field" id="e-text" rows="5" aria-label="생기부 문장">${esc(it.sentence)}</textarea>
      <div class="edit-actions"><button type="button" class="primary sm" data-act="s-save">수정 저장</button><button type="button" class="link" data-act="s-cancel">취소</button></div>
    </div>`
    :`<blockquote class="quote"><span class="hl">${esc(it.sentence)}</span></blockquote>`;
  return `<div class="meta"><span class="chip static" style="${cvar(it.area)}">${AREA_LABEL[it.area]||"기타"}</span>${GL(it.grade)}${it.subject?" · "+esc(it.subject):""}</div>
    ${body}
    <div class="region" data-region="qlist">
    <h2 class="sub">예상 질문 <span class="count">${qs.length}개</span></h2>
    ${qs.length?`<ul class="qrows">${qs.map((q,i)=>`<li><button type="button" class="qrow${q.done?" done":""}" data-go="question" data-id="${c.id}" data-qid="${q.id}">
        <span class="qn">Q${i+1}</span><span class="qt">${esc(q.q)}</span>
        <span class="qs">${q.done?"준비 완료":(q.a&&q.a.trim()?"답변 작성됨":"답변 없음")}${(q.tails||[]).length?` · 꼬리질문 ${q.tails.length}`:""}</span></button></li>`).join("")}</ul>`
      :`<p class="hint">이 문장을 보고 면접관이 물을 만한 질문을 적어보세요.</p>`}
    </div>
    ${S.editing||it.area==="common"?"":`<button type="button" class="ghost" data-go="para" data-id="${c.id}">이 문단 전체 보고 답변 쓰기 →</button>`}
    ${S.editing?"":aiBox("s",c.id,null)}
    <form class="addq" data-act="add-q"><input class="field" id="s-addq" value="${esc(S.drafts[c.id]||"")}" placeholder="이 문장을 보고 면접 질문을 직접 써보세요" autocomplete="off" aria-label="새 질문"><button class="primary sm">추가</button></form>
    ${S.editing?"":(()=>{const l=browseList(),i=l.findIndex(x=>x.id===c.id);return i<0?"":`<div class="pager">
      <button type="button" class="ghost" data-act="s-move" data-v="${l[i-1]?.id||""}"${i>0?"":" disabled"}>← 이전 문장</button>
      <button type="button" class="ghost" data-act="s-move" data-v="${l[i+1]?.id||""}"${i<l.length-1?"":" disabled"}>다음 문장 →</button></div><p class="kbd-hint">입력 중에도 키보드 ← → 로 넘길 수 있어요</p>`})()}
    ${S.editing?"":`<div class="quiet"><button type="button" class="link" data-act="s-edit">문장 수정</button><button type="button" class="link danger" data-act="s-del">${S.confirm==="s"?"한 번 더 누르면 삭제":"문장 삭제"}</button></div>`}`;
}

/* question */

  return `<p class="ctx">${esc(it.sentence)}</p>
    ${it.area==="common"?"":`<button type="button" class="link" data-go="para" data-id="${c.id}">문단 전체 보며 답변 쓰기 →</button>`}
    <p class="qno">Q${i+1} / ${qs.length}</p>

        <div class="edit-actions"><button type="button" class="primary sm" data-act="q-save">수정 저장</button><button type="button" class="link" data-act="q-cancel">취소</button></div></div>`
      :`<h1 class="qbig">${esc(q.q)}</h1>`}
    <label><span class="label">내 답변 <em>· 입력하면 자동 저장</em></span>

    ${aiBox("q",c.id,q)}
    <section class="tails" aria-label="꼬리질문">
      <div class="region" data-region="tlist">
      <h2 class="sub">꼬리질문 <span class="count">${(q.tails||[]).length}개</span></h2>
      ${(q.tails||[]).length?"":`<p class="hint">내 답변을 들은 면접관이 이어서 물을 질문을 적어두세요. 예: “그 방법을 고른 이유는?”</p>`}
      ${(q.tails||[]).map((t,k)=>`<div class="tail">

          <button type="button" class="link danger" data-act="t-del" data-v="${t.id}">${S.confirm==="t:"+t.id?"정말 삭제?":"삭제"}</button></div>
        <textarea class="field tail-a autosave" id="ta-${t.id}" data-id="${c.id}" data-qid="${q.id}" data-tid="${t.id}" data-field="a" placeholder="꼬리질문 답변" aria-label="꼬리질문 ${k+1} 답변">${esc(t.a||"")}</textarea>
        ${subsHTML(c.id,q.id,t,"꼬리 "+(k+1))}
      </div>`).join("")}
      </div>
      <form class="addq" data-act="add-t"><input class="field" id="t-add" value="${esc(S.tdrafts[q.id]||"")}" placeholder="꼬리질문 입력" autocomplete="off" aria-label="새 꼬리질문"><button class="primary sm">추가</button></form>

    <div class="pager">

    <div class="quiet"><button type="button" class="link" data-act="q-editbtn">질문 수정</button><button type="button" class="link danger" data-act="q-del">${S.confirm==="q"?"한 번 더 누르면 삭제":"질문 삭제"}</button></div>`;
}

/* practice */
function pool(){
  const out=[];
  all().forEach(it=>{
    if(P.grade!=="all"&&String(it.grade)!==P.grade)return;
    if(P.area!=="all"&&it.area!==P.area)return;
    qsOf(it.id).forEach(q=>{if(!P.undone||!q.done)out.push({id:it.id,qid:q.id})});
  });
  return out;
}
function vSetup(){
  const n=pool().length;
  return `<h1 class="title">면접 연습</h1>
    <p class="lead">질문이 무작위로 하나씩 나와요. 소리 내어 답해 보세요.</p>
    <div><span class="label">학년</span>${seg("p-grade",P.grade,GRADES)}</div>
    <div><span class="label">영역</span>${areaChips("p-area",P.area,true,false)}</div>
    <label class="toggle"><input type="checkbox" id="p-undone"${P.undone?" checked":""}> 준비 안 된 질문만</label>
    <button type="button" class="primary" data-act="p-start"${n?"":" disabled"}>${n?`질문 ${n}개로 시작`:"연습할 질문이 없어요"}</button>`;
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function vPractice(){
  if(P.idx>=P.order.length){
    return `<div class="finish"><p class="eyebrow" style="color:var(--ink-2)">한 바퀴 완료</p><p class="big">${P.order.length}<span>문항</span></p><p class="lead" style="margin:0">끝까지 연습했어요.</p></div>
      <button type="button" class="primary" data-act="p-again">다시 섞어서 시작</button>
      <div class="quiet"><button type="button" class="link" data-act="home">홈으로</button></div>`;
  }
  const c=P.order[P.idx],it=items.get(c.id),q=it&&qsOf(c.id).find(x=>x.id===c.qid);
  if(!q){P.order.splice(P.idx,1);return vPractice()}
  const secs=Math.floor((Date.now()-P.start)/1000),last=P.idx===P.order.length-1,tails=q.tails||[];
  return `<div class="p-top"><span>${P.idx+1} / ${P.order.length}</span><span class="timer${secs>90?" over":""}" id="ptimer" title="답변은 1분 30초 이내 권장">${fmt(secs)}</span></div>
    <div class="p-stage">

/* ---------- 영타 → 한글 ---------- */
const KEYMAP={q:"ㅂ",w:"ㅈ",e:"ㄷ",r:"ㄱ",t:"ㅅ",y:"ㅛ",u:"ㅕ",i:"ㅑ",o:"ㅐ",p:"ㅔ",a:"ㅁ",s:"ㄴ",d:"ㅇ",f:"ㄹ",g:"ㅎ",h:"ㅗ",j:"ㅓ",k:"ㅏ",l:"ㅣ",z:"ㅋ",x:"ㅌ",c:"ㅊ",v:"ㅍ",b:"ㅠ",n:"ㅜ",m:"ㅡ",Q:"ㅃ",W:"ㅉ",E:"ㄸ",R:"ㄲ",T:"ㅆ",O:"ㅒ",P:"ㅖ"};
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const VCOMB={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const CCOMB={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const CSPLIT=Object.fromEntries(Object.entries(CCOMB).map(([k,v])=>[v,[...k]]));
function compose(jamos){
  let out="",cho=null,jung=null,jong=null;
  const flush=()=>{
    if(cho&&jung)out+=String.fromCharCode(0xAC00+(CHO.indexOf(cho)*21+JUNG.indexOf(jung))*28+JONG.indexOf(jong||""));
    else out+=(cho||"")+(jung||"");
    cho=jung=jong=null;
  };
  for(const j of jamos){
    if(!JUNG.includes(j)){
      if(cho&&jung){
        if(!jong){if(JONG.includes(j))jong=j;else{flush();cho=j}}
        else if(CCOMB[jong+j])jong=CCOMB[jong+j];
        else{flush();cho=j}
      }else{if(cho||jung)flush();cho=j}
    }else{
      if(cho&&jung&&jong){
        let keep=null,move=jong;if(CSPLIT[jong])[keep,move]=CSPLIT[jong];
        jong=keep;flush();cho=move;jung=j;
      }else if(jung){if(VCOMB[jung+j])jung=VCOMB[jung+j];else{flush();jung=j}}
      else jung=j;
    }
  }
  flush();return out;
}
function engToKor(str){
  return str.replace(/[A-Za-z]+/g,w=>compose([...w].map(ch=>KEYMAP[ch]||KEYMAP[ch.toLowerCase()])));
}
let K=null;
function kHide(){K=null;const el=document.getElementById("kfix");if(el)el.hidden=true}
function kCheck(el){
  if(!(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&(el.type==="text"||el.type==="search")))){kHide();return}
  const pos=el.selectionEnd??el.value.length,before=el.value.slice(0,pos);
  const m=before.match(/[A-Za-z][A-Za-z0-9 ,.!?'"()~\-]*$/);
  if(!m){kHide();return}
  const toks=m[0].replace(/\s+$/,"").split(/(\s+)/);
  let from=toks.length;
  for(let i=toks.length-1;i>=0;i--){
    const t=toks[i];if(/^\s*$/.test(t))continue;
    if(/[A-Z]/.test(t.replace(/[QWERTOP]/g,"")))break;
    const cv=engToKor(t);if(/[A-Za-z]/.test(t)&&(/[ㄱ-ㅣ]/.test(cv)||!/[가-힣]/.test(cv)))break;
    from=i;
  }
  while(from<toks.length&&/^\s*$/.test(toks[from]))from++;
  const run=toks.slice(from).join(""),letters=(run.match(/[A-Za-z]/g)||[]).length;
  const conv=engToKor(run);
  if(letters<3||!/[가-힣]/.test(conv)){kHide();return}
  const start=m.index+toks.slice(0,from).join("").length;
  K={el,start,end:start+run.length,conv};
  document.getElementById("kfix-t").textContent=`“${run.length>18?"…"+run.slice(-18):run}” → “${conv.length>18?"…"+conv.slice(-18):conv}”`;
  document.getElementById("kfix").hidden=false;
}
function kApply(){
  if(!K)return;
  const el=document.body.contains(K.el)?K.el:document.getElementById(K.el.id);if(!el){kHide();return}
  const{start,end,conv}=K,v=el.value;
  el.value=v.slice(0,start)+conv+v.slice(end);
  const c=start+conv.length;el.focus();try{el.setSelectionRange(c,c)}catch(e){}
  kHide();el.dispatchEvent(new Event("input",{bubbles:true}));
}

function splitSentences(t){
  return t.split(/\n+/).flatMap(line=>line.split(/(?<=[.!?。])\s+(?=\S)/)).map(s=>s.trim()).filter(Boolean);
}
async function saveAdd(){
  const text=A.text.trim();
  if(!text){A.msg="생기부 문장을 입력하세요.";A.bad=true;render(true);focusLater("#a-text");return}
  if(!db){A.msg="저장소에 연결되지 않아 저장할 수 없어요.";A.bad=true;render(true);return}
  store.set("lastGrade",String(A.grade));store.set("lastArea",A.area);
  const parts=A.split?splitSentences(text):[text];
  A.saving=true;A.msg="";render(true);setSync("저장 중…","busy");
  let n=0;const base=Date.now();
  try{
    for(const s of parts){
      await db.collection("items").doc().set({grade:A.grade,area:A.area,subject:A.subject.trim(),sentence:s,questions:[],...(parts.length>1?{para:"p"+base}:{}),createdAt:base+n,updatedAt:base+n});n++;
    }
    A.text="";A.msg=`✓ ${n}개 문장을 저장했어요. 이어서 추가할 수 있어요.`;A.bad=false;
  }catch(err){A.msg=(n?`${n}개까지 저장됨. `:"")+errText(err);A.bad=true}
  A.saving=false;render(true);
}

    });
    items=next;loaded=true;
    if(snap.metadata.hasPendingWrites)setSync("저장 중…","busy");
    else{const t=new Date();setSync(`동기화됨 ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`,"ok");banner=""}
    render();
  },()=>{
    setSync("연결 끊김","bad");banner="저장소 연결이 끊겼어요. 페이지를 새로고침해 주세요.";render();
  });
})();
</script>


</html>
